<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18181b">
<title>Sem conexão · PreventBase</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom));background:#18181b radial-gradient(ellipse at top,rgba(251,203,10,.18),transparent 60%);color:#18181b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{width:min(100%,380px);text-align:center}
  .brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
  .brand .mark{width:112px;height:auto}
  .brand .word{width:220px;height:auto}
  main{background:#fff;border-top:4px solid #fbcb0a;border-radius:16px;padding:28px 24px;box-shadow:0 20px 40px rgba(0,0,0,.4)}
  h1{font-size:clamp(1.1rem,4vw,1.35rem);margin:0 0 8px}
  p{color:#52525b;line-height:1.5;margin:0 0 20px}
  button{min-height:44px;width:100%;border:0;border-radius:10px;background:#fbcb0a;color:#18181b;font:inherit;font-weight:600;cursor:pointer}
  button:hover{background:#f5b400}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="mark" src="/brand/mark.png" alt="">
    <img class="word" src="/brand/wordmark.png" alt="PreventBase">
  </div>
  <main>
    <h1>Sem conexão</h1>
    <p>O PreventBase precisa de internet para registrar entregas, biometria e estoque com validade legal. Verifique a rede e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</div>
<script>addEventListener("online",function(){location.reload()})</script>
</body>
</html>
