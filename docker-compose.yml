# PreventBase — stack completa (MASTER-PLAN §5). Portas: C:\ROBBY\config\ports.json (id 31).
# Host: nginx :3100 (web + /api/) · :3101 (só /api/) · postgres :3110 · minio 127.0.0.1:3112/:3113.
# Redis, worker e biometric só na rede interna.

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-preventbase}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-preventbase}?schema=public
  REDIS_URL: redis://redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-preventbase}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_BUCKET: ${MINIO_BUCKET:-preventbase-documents}
  JWT_SECRET: ${JWT_SECRET}
  JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
  REFRESH_TTL_DAYS: ${REFRESH_TTL_DAYS:-14}
  BIOMETRIC_SERVICE_URL: http://biometric:8000
  BIOMETRIC_SERVICE_TOKEN: ${BIOMETRIC_SERVICE_TOKEN}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3100}
  CAEPI_SOURCE_URL: ${CAEPI_SOURCE_URL:-}
  VERITECH_SSO_URL: ${VERITECH_SSO_URL:-https://servidor.taild57d57.ts.net}
  VERITECH_SSO_INTERNAL_URL: http://host.docker.internal:2922
  VERITECH_SSO_LOCAL_LOGIN: ${VERITECH_SSO_LOCAL_LOGIN:-1}
  SEED_TENANT_NAME: ${SEED_TENANT_NAME:-PreventBase}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@preventbase.local}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:16-alpine
    container_name: preventbase-postgres
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-preventbase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-preventbase}
      TZ: UTC
    ports:
      - "${PREVENTBASE_PG_PORT:-3110}:5432"
    volumes:
      - preventbase_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-preventbase} -d ${POSTGRES_DB:-preventbase}"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [default, robby_net]

  redis:
    image: redis:7-alpine
    container_name: preventbase-redis
    restart: unless-stopped
    mem_limit: 256m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - preventbase_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: preventbase-minio
    restart: unless-stopped
    mem_limit: 512m
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-preventbase}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${PREVENTBASE_MINIO_API_PORT:-3112}:9000"
      - "127.0.0.1:${PREVENTBASE_MINIO_CONSOLE_PORT:-3113}:9001"
    volumes:
      - preventbase_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  biometric:
    build:
      context: apps/biometric-service
    image: preventbase-biometric:latest
    container_name: preventbase-biometric
    restart: unless-stopped
    mem_limit: 1g
    environment:
      BIOMETRIC_SERVICE_TOKEN: ${BIOMETRIC_SERVICE_TOKEN}
      BIOMETRIC_TEMPLATE_KEY: ${BIOMETRIC_TEMPLATE_KEY}
      BIOMETRIC_MATCH_THRESHOLD: ${BIOMETRIC_MATCH_THRESHOLD:-0.363}
      BIOMETRIC_DATA_DIR: /data
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: America/Sao_Paulo
    volumes:
      - preventbase_biometric_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    image: preventbase-api:latest
    container_name: preventbase-api
    restart: unless-stopped
    mem_limit: 1g
    environment:
      <<: *app-env
      APP_HOST: 0.0.0.0
      APP_PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      biometric: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: worker
    image: preventbase-worker:latest
    container_name: preventbase-worker
    restart: unless-stopped
    mem_limit: 768m
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: web
    image: preventbase-web:latest
    container_name: preventbase-web
    restart: unless-stopped
    mem_limit: 768m
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 8
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: preventbase-nginx
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "0.0.0.0:${PREVENTBASE_WEB_PORT:-3100}:80"
      - "0.0.0.0:${PREVENTBASE_API_PORT:-3101}:8001"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_started }
      web: { condition: service_started }
    networks: [default, robby_net]

  backup:
    image: postgres:16-alpine
    container_name: preventbase-backup
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-preventbase}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-preventbase}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: America/Sao_Paulo
    volumes:
      - ./infrastructure/postgres/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
      - preventbase_minio_data:/sources/minio:ro
      - preventbase_biometric_data:/sources/biometric:ro
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  preventbase_pg_data:
  preventbase_redis_data:
  preventbase_minio_data:
  preventbase_biometric_data:

networks:
  robby_net:
    external: true
    name: robby_net
