server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 60m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $web_upstream http://web:3000;

    add_header X-Content-Type-Options "nosniff" always;
    # Embeddable only by the Veritech portal tabs (tailnet); see C:\ROBBY\docs\robby\portal.md.
    add_header Content-Security-Policy "frame-ancestors 'self' https://servidor.taild57d57.ts.net https://servidor.taild57d57.ts.net:* http://servidor:* http://localhost:* http://127.0.0.1:*" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# API-only listener (host :3101, ROBBY port standard). Swagger e demais rotas só via /api/.
server {
    listen 8001;
    server_name _;

    server_tokens off;
    client_max_body_size 60m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
